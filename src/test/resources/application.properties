# Testcontainers supplies PostgreSQL and Redis; Flyway runs the packaged migrations.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

app.auth.secret=test-secret-key-for-hs256-must-be-at-least-32-bytes
app.auth.access-token-ttl=30m
app.auth.refresh-token-ttl=14d
app.auth.signup-token-ttl=10m
app.auth.cookie.name=refresh_token
app.auth.cookie.path=/api/v1/auth
# 테스트는 http로 호출하므로 Secure 쿠키를 끈다. 운영 기본값은 true다.
app.auth.cookie.secure=false
app.auth.cookie.same-site=Lax

app.auth.local.code-ttl=10m
app.auth.local.code-max-attempts=5
app.auth.local.resend-gap=60s
app.auth.local.resend-limit=5
app.auth.local.resend-window=1h
app.auth.local.login-fail-limit=5
app.auth.local.login-fail-window=10m

# 메일 발송은 AuthMailSender를 대역으로 바꾸므로 실제 접속하지 않는다.
spring.mail.host=localhost
spring.mail.port=1025
app.mail.from=no-reply@reused.test
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.kakao.client-id=test-client-id
app.kakao.client-secret=test-client-secret
app.kakao.token-uri=http://localhost/oauth/token
app.kakao.user-info-uri=http://localhost/v2/user/me
app.kakao.connect-timeout=3s
app.kakao.read-timeout=5s

app.moderation.default-suspension=7d
app.moderation.expiry-check-interval=60s
# 테스트는 예약 실행을 끄고 SuspensionExpiryJob.releaseExpired()를 직접 부른다.
app.moderation.expiry-job-enabled=false

app.chatbot.enabled=true
app.chatbot.rate-limit=5
app.chatbot.rate-window=1m
app.chatbot.executor.pool-size=4
app.chatbot.executor.queue-capacity=8
# 키를 비워 실제 LLM 클라이언트를 만들지 않는다. 챗봇 테스트는 LlmClient를 대역으로 바꾼다.
app.chatbot.llm.api-key=
app.chatbot.llm.base-url=
app.chatbot.llm.model=claude-opus-5
app.chatbot.llm.timeout=15s
app.chatbot.llm.max-tokens=4096
app.chatbot.llm.max-answer-length=1000
