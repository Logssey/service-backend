# This profile alone does not activate endpoints. A flag, namespace and random token are required.
attack-lab.enabled=${ATTACK_LAB_ENABLED:false}
attack-lab.token=${ATTACK_LAB_TOKEN:}
attack-lab.namespace=${POD_NAMESPACE:}
app.kakao.stub=true
app.kakao.client-id=attack-lab-stub
app.chatbot.enabled=false
app.chatbot.free-input-enabled=false
app.moderation.expiry-job-enabled=false
app.auth.cookie.secure=false
server.error.include-message=never
server.error.include-stacktrace=never
