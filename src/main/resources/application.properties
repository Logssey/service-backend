spring.application.name=service-backend

# 스키마는 schema/ 아래 SQL 스크립트로만 관리한다(04-data/database-ddl.md).
# Hibernate가 테이블을 만들거나 바꾸지 않는다.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# 시크릿은 파일에 두지 않고 환경변수로 주입한다(NFR-CRED-007).
app.auth.secret=${JWT_SECRET}
app.auth.access-token-ttl=30m
app.auth.refresh-token-ttl=14d
app.auth.signup-token-ttl=10m
app.auth.cookie.name=refresh_token
app.auth.cookie.path=/api/v1/auth
# 로컬에서 http로 접속하면 APP_AUTH_COOKIE_SECURE=false로 내린다.
app.auth.cookie.secure=true
app.auth.cookie.same-site=Lax

# 이메일 계정 정책 값(business-rules 4장). 기본값이 정책 값과 같아 보통 바꾸지 않는다.
app.auth.local.code-ttl=10m
app.auth.local.code-max-attempts=5
app.auth.local.resend-gap=60s
app.auth.local.resend-limit=5
app.auth.local.resend-window=1h
app.auth.local.login-fail-limit=5
app.auth.local.login-fail-window=10m

# 인증 메일. 로컬은 Mailpit(SMTP 1025, 웹 UI 8025) 같은 대역을 쓴다(workload-and-open-items.md).
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:no-reply@reused.local}
# 외부 호출 제한 시간(NFR-EXT-002, 밀리초). 없으면 SMTP 장애 시 요청 스레드가 무기한 묶인다.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.kakao.client-id=${KAKAO_CLIENT_ID}
app.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
app.kakao.token-uri=https://kauth.kakao.com/oauth/token
app.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
# 외부 호출 제한 시간(NFR-EXT-002).
app.kakao.connect-timeout=3s
app.kakao.read-timeout=5s

management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health

# Empty bucket keeps image APIs unavailable without preventing local startup.
# Credentials use the AWS default provider chain; do not commit them here.
app.image.s3.bucket=${IMAGE_S3_BUCKET:}
app.image.s3.region=${IMAGE_S3_REGION:ap-northeast-2}
app.image.s3.endpoint=${IMAGE_S3_ENDPOINT:}
app.image.orphan-retention=${IMAGE_ORPHAN_RETENTION:24h}
app.image.cleanup-interval=${IMAGE_CLEANUP_INTERVAL:1h}
app.image.unattached-limit=${IMAGE_UNATTACHED_LIMIT:20}

# 이용정지 정책(business-rules 4장 "이용정지 기본 기간 7일"). 신고 처리의 SUSPEND_USER가 쓴다.
app.moderation.default-suspension=7d
# 기간이 끝난 정지를 ACTIVE로 되돌리는 작업. B 판정(isSuspendedAt)은 이 작업과 무관하게 정확하지만,
# 상태값을 보는 판정(ActorGuard 등 isSuspended())은 이 작업이 돌 때까지 최대 한 주기 늦게 풀린다. 끄지 않는다.
app.moderation.expiry-check-interval=60s
app.moderation.expiry-job-enabled=true

# 챗봇(ADR-003). 비활성화 스위치를 끄면 두 엔드포인트 모두 503이다. 바꾸려면 재기동한다.
app.chatbot.enabled=${CHATBOT_ENABLED:true}
# 사용자당 분당 5회(business-rules 4장), Redis reused:chatbot:rate:{userId} TTL 1분(redis-keys.md).
app.chatbot.rate-limit=5
app.chatbot.rate-window=1m
# 챗봇 전용 스레드 풀. 동시에 LLM을 기다리는 요청은 최대 4 + 8개이고 나머지는 503이다(NFR-EXT-001).
app.chatbot.executor.pool-size=4
app.chatbot.executor.queue-capacity=8
# 키가 비어 있으면 LLM이 꺼진다. 추천 질문은 동작하고 자유 입력만 503이다. 파일에 키를 두지 않는다(NFR-CRED-007).
app.chatbot.llm.api-key=${ANTHROPIC_API_KEY:}
app.chatbot.llm.base-url=${ANTHROPIC_BASE_URL:}
app.chatbot.llm.model=claude-opus-5
# 요청 하나의 전체 제한 시간(NFR-EXT-002). 풀 대기, 재시도(1회), 응답을 모두 포함한다.
app.chatbot.llm.timeout=15s
app.chatbot.llm.max-tokens=4096
app.chatbot.llm.max-answer-length=1000
