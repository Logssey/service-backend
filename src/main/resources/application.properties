spring.application.name=service-backend

# 스키마는 schema/ 아래 SQL 스크립트로만 관리한다(04-data/database-ddl.md).
# Hibernate가 테이블을 만들거나 바꾸지 않는다.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# 시크릿은 파일에 두지 않고 환경변수로 주입한다.
app.auth.secret=${JWT_SECRET}
app.auth.access-token-ttl=30m
app.auth.refresh-token-ttl=14d
app.auth.signup-token-ttl=10m
app.auth.cookie.name=refresh_token
app.auth.cookie.path=/api/v1/auth
app.auth.cookie.secure=true
app.auth.cookie.same-site=Lax

app.kakao.client-id=${KAKAO_CLIENT_ID}
app.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
app.kakao.token-uri=https://kauth.kakao.com/oauth/token
app.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
