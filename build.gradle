plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.reused'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// Spring Boot 4는 RestClient.Builder 자동 구성이 webmvc 스타터에 포함되지 않는다. KakaoApiClient가 사용한다.
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'org.springframework.security:spring-security-oauth2-jose'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	// Argon2PasswordEncoder가 Bouncy Castle 구현을 사용한다(business-rules 정책 값: argon2id).
	implementation 'org.bouncycastle:bcprov-jdk18on:1.81'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation platform('software.amazon.awssdk:bom:2.55.4')
	implementation 'software.amazon.awssdk:s3'
	implementation 'com.twelvemonkeys.imageio:imageio-webp:3.15.2'
	// 챗봇 자유 입력 답변(ADR-003). 호출은 chatbot.llm.LlmClient 뒤에 있어 공급자를 바꾸면 이 줄과 어댑터만 바뀐다.
	implementation 'com.anthropic:anthropic-java:2.34.0'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-redis-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

// schema/*.sql is the single source; package Flyway migrations for runtime and tests.
def migrationNames = [
	'001_init.sql': 'V1__init.sql',
	'002_seed_categories.sql': 'V2__seed_categories.sql',
	'003_profile_images.sql': 'V3__profile_images.sql'
]
tasks.named('processResources') {
	from("$projectDir/schema") {
		include migrationNames.keySet()
		into 'db/migration'
		rename { name -> migrationNames[name] }
	}
}

tasks.named('test') {
	useJUnitPlatform { excludeTags 'marketplace-e2e' }
}

tasks.register('buildChat', Exec) {
    workingDir 'chat-server'
    inputs.dir('chat-server/src')
    inputs.file('chat-server/tsconfig.json')
    inputs.file('chat-server/package-lock.json')
    inputs.file('chat-server/package.json')
    outputs.dir('chat-server/dist')
    doFirst {
        if (!file('chat-server/node_modules/typescript').isDirectory()) {
            throw new GradleException('Run npm ci in chat-server before marketplaceE2E')
        }
    }
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'npm', 'run', 'build'
    } else {
        commandLine 'npm', 'run', 'build'
    }
}

// npm ci in chat-server first. Uses real HTTP, sockets, PostgreSQL and Redis.
tasks.register('marketplaceE2E', Test) {
    description = 'Verify the complete marketplace with the actual Socket.IO gateway'
    group = 'verification'
    dependsOn tasks.named('buildChat')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    inputs.file('scripts/marketplace-e2e.mjs')
    inputs.file('chat-server/package-lock.json')
    inputs.dir('chat-server/dist')
    useJUnitPlatform { includeTags 'marketplace-e2e' }
    shouldRunAfter tasks.named('test')
}

// 실행 불가능한 plain JAR 을 만들지 않는다.
// build/libs 에 JAR 이 하나만 남아야 Dockerfile 의 와일드카드가 안전하다.
tasks.named('jar') {
    enabled = false
}
